<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Encuesta Ciudadana León 2026 | El Bajío en Datos</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    :root {
      --bg:          #0a0a0a;
      --surface:     #141414;
      --card:        #191919;
      --card-sel:    #0c2318;
      --green:       #3dff6e;
      --green-soft:  #8fffa8;   /* highlight en texto — más suave */
      --green-dim:   #1a7a33;
      --green-glow:  #3dff6e28;
      --white:       #f0f0f0;
      --gray:        #6a6a6a;
      --gray-lt:     #aaa;
      --border:      #222;
      --border-sel:  #3dff6e;
      --radius:      15px;
      --trans:       0.2s cubic-bezier(.4,0,.2,1);
    }
    html { height: -webkit-fill-available; scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--white);
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh; min-height: -webkit-fill-available;
      display: flex; flex-direction: column; align-items: center;
      padding: calc(env(safe-area-inset-top,0px))
               calc(env(safe-area-inset-right,0px) + 20px)
               calc(env(safe-area-inset-bottom,0px) + 56px)
               calc(env(safe-area-inset-left,0px) + 20px);
      overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: none;
    }

    /* ── TOPBAR ── */
    .topbar {
      width: 100%; max-width: 680px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0 22px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-img { width: 36px; height: 36px; border-radius: 9px; object-fit: contain; background: #000; flex-shrink: 0; }
    .logo-name { font-size: 13px; font-weight: 800; color: var(--white); letter-spacing: .2px; }
    .badge-live {
      display: inline-flex; align-items: center; gap: 7px;
      background: #0d2318; border: 1px solid var(--green-dim);
      color: var(--green); font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.6px;
      padding: 7px 13px; border-radius: 99px; flex-shrink: 0;
    }
    .badge-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: blink 1.5s ease infinite; flex-shrink: 0; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }

    /* ── PROGRESS ── */
    .progress-wrap { width: 100%; max-width: 680px; margin-bottom: 10px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--gray); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .6px; }
    .step-label { color: var(--green); }
    .progress-bar-bg { height: 4px; background: #1e1e1e; border-radius: 99px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg,var(--green-dim),var(--green)); border-radius: 99px; transition: width .55s cubic-bezier(.4,0,.2,1); box-shadow: 0 0 10px var(--green-glow); }

    /* ── SCREENS ── */
    .screen { width: 100%; max-width: 680px; animation: slideIn .3s cubic-bezier(.4,0,.2,1); }
    @keyframes slideIn { from{opacity:0;transform:translateX(26px)} to{opacity:1;transform:translateX(0)} }
    .screen.out { animation: slideOut .18s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes slideOut { to{opacity:0;transform:translateX(-26px)} }

    /* ── WELCOME ── */
    .hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 24px; align-items: center; margin-bottom: 32px; }

    .welcome-title {
      font-size: clamp(34px, 5.8vw, 56px);
      font-weight: 900; line-height: 1.03; letter-spacing: -2.5px;
      color: rgba(255,255,255,.35); /* ¿ y ? en blanco apagado */
    }
    .welcome-title .t-accent { color: var(--green); }
    .welcome-title .t-white  { color: var(--white); }
    .welcome-title .t-qmark  { color: var(--white); }

    .hero-right { display: flex; flex-direction: column; gap: 14px; }

    .hero-desc {
      font-size: 14px; font-weight: 500; color: var(--gray-lt);
      line-height: 1.65; border-left: 2px solid var(--green-dim);
      padding-left: 14px;
    }
    .hero-desc strong { color: var(--white); font-weight: 700; }

    .hero-chips { display: flex; flex-direction: column; gap: 8px; }
    .hero-chip {
      display: flex; align-items: center; gap: 10px;
      background: #111; border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 14px;
    }
    .chip-icon { font-size: 16px; flex-shrink: 0; }
    .chip-text { font-size: 12.5px; font-weight: 600; color: var(--gray-lt); }
    .chip-text b { color: var(--white); font-weight: 800; }

    /* ── PRIVACY ── */
    .privacy-block {
      margin-top: 20px;
      background: #0f0f0f;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 16px 18px;
    }
    .privacy-headline {
      font-size: 13px; font-weight: 800; color: var(--white);
      margin-bottom: 6px; display: flex; align-items: center; gap: 7px;
    }
    .privacy-headline::before { content: '🔒'; font-size: 14px; }
    .privacy-body { font-size: 11.5px; color: #555; line-height: 1.75; font-weight: 400; }

    /* ── Q HEADER ── */
    .q-number { font-size: 10px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
    .q-title  {
      font-size: clamp(16px,3.5vw,20px); font-weight: 600;
      line-height: 1.45; margin-bottom: 8px; color: var(--white);
    }
    .q-title strong { font-weight: 800; color: var(--green-soft); }
    .q-sub { font-size: 12px; color: var(--gray); margin-bottom: 20px; font-weight: 500; }
    .sel-count { color: var(--green); font-weight: 700; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: calc(env(safe-area-inset-bottom,0px) + 22px);
      left: 50%; transform: translateX(-50%) translateY(16px);
      background: #1a1a1a; border: 1px solid var(--green-dim);
      color: var(--green); font-size: 13px; font-weight: 700;
      padding: 12px 22px; border-radius: 99px;
      box-shadow: 0 8px 28px rgba(0,0,0,.7);
      white-space: nowrap; z-index: 999;
      opacity: 0; transition: opacity .24s ease, transform .24s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── CANDIDATE GRID ── */
    .cand-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap: 9px; margin-bottom: 24px; align-items: stretch; }

    .cand-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 14px 14px;
      cursor: pointer; position: relative; overflow: hidden;
      transition: border-color var(--trans), background var(--trans), box-shadow var(--trans), transform .12s ease;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    }
    .cand-card:hover { border-color: #333; background: #1f1f1f; }
    .cand-card:active { transform: scale(0.955); }

    .cand-card.selected {
      background: var(--card-sel);
      border-color: var(--border-sel);
      box-shadow: 0 0 0 1px var(--green), 0 6px 20px var(--green-glow);
    }
    .cand-card.maxed:not(.selected) { opacity: .22; pointer-events: none; }

    .c-check {
      position: absolute; top: 9px; right: 9px;
      width: 20px; height: 20px; background: var(--green);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 900; color: #000;
      opacity: 0; transform: scale(0.3) rotate(-90deg);
      transition: all .28s cubic-bezier(.34,1.56,.64,1);
    }
    .cand-card.selected .c-check { opacity: 1; transform: scale(1) rotate(0deg); }

    .c-name {
      font-size: 13px; font-weight: 700; line-height: 1.3;
      color: var(--white); transition: color var(--trans);
      padding-right: 22px;
    }
    .cand-card.selected .c-name { color: var(--green); }
    .cand-card.tono .c-name { font-size: 14.2px; } /* sutilmente más grande */

    .c-bar {
      width: 24px; height: 3px; background: var(--border);
      border-radius: 99px; transition: all var(--trans);
    }
    .cand-card.selected .c-bar { background: var(--green); width: 36px; }

    /* ── OTRO INPUT ── */
    .otro-input-wrap { margin-top: 10px; animation: fadeUp .25s ease; }
    .otro-input {
      width: 100%; background: #111; border: 1.5px solid var(--green-dim);
      border-radius: 10px; padding: 12px 14px; color: var(--white);
      font-family: 'Montserrat',-apple-system,sans-serif; font-size: 13px; font-weight: 600;
      outline: none; transition: border-color var(--trans);
    }
    .otro-input:focus { border-color: var(--green); }
    .otro-input::placeholder { color: #444; font-weight: 400; }

    /* ── PARTY CARDS ── */
    .party-list { display: grid; gap: 9px; margin-bottom: 24px; }
    .party-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 15px 17px; cursor: pointer;
      transition: border-color var(--trans), background var(--trans), box-shadow var(--trans), transform .12s ease;
      display: flex; align-items: center; gap: 13px;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .party-card:active { transform: scale(0.97); }
    .party-card.selected { background: var(--card-sel); border-color: var(--green); box-shadow: 0 0 0 1px var(--green), 0 4px 16px var(--green-glow); }
    .party-card.selected .p-radio { background: var(--green); border-color: var(--green); }
    .party-card.selected .p-radio::after { opacity: 1; transform: scale(1); }
    .party-card.selected .p-name { color: var(--green); }
    .p-radio { width: 21px; height: 21px; border: 2px solid #3a3a3a; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all var(--trans); }
    .p-radio::after { content: ''; width: 7px; height: 7px; background: #000; border-radius: 50%; opacity: 0; transform: scale(0); transition: all .22s cubic-bezier(.34,1.56,.64,1); }
    .p-emoji { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; overflow: hidden; }
    .p-emoji img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
    .p-name  { font-size: 14px; font-weight: 700; transition: color var(--trans); }
    .p-desc  { font-size: 11px; color: var(--gray); margin-top: 1px; font-weight: 400; }

    /* ── BUTTONS ── */
    .btn-row { display: flex; gap: 10px; align-items: center; }
    .btn-primary {
      background: var(--green); color: #000; border: none; border-radius: 13px;
      padding: 17px 24px; font-family: 'Montserrat',-apple-system,sans-serif;
      font-size: 13.5px; font-weight: 800; cursor: pointer;
      letter-spacing: .3px; text-transform: uppercase; flex: 1; min-height: 54px;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: opacity .15s, transform .12s ease;
    }
    .btn-primary:active { transform: scale(0.96); opacity: .88; }
    .btn-primary:disabled { opacity: .22; pointer-events: none; }
    .btn-back {
      background: transparent; color: var(--gray); border: 1.5px solid var(--border);
      border-radius: 13px; padding: 17px 17px; font-family: 'Montserrat',-apple-system,sans-serif;
      font-size: 13px; font-weight: 600; cursor: pointer; min-height: 54px;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: border-color var(--trans), color var(--trans), transform .12s ease;
    }
    .btn-back:active { transform: scale(0.96); border-color: #555; color: var(--white); }

    /* ── THANK YOU ── */
    .ty-screen { text-align: center; padding: 48px 0 0; }
    .ty-icon {
      width: 80px; height: 80px; background: #0c2318; border: 2px solid var(--green);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 34px; margin: 0 auto 28px;
      animation: popIn .5s cubic-bezier(.34,1.56,.64,1) .1s both;
      box-shadow: 0 0 40px var(--green-glow);
    }
    @keyframes popIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
    .ty-title { font-size: clamp(28px,6vw,40px); font-weight: 900; margin-bottom: 14px; letter-spacing: -1.5px; animation: fadeUp .5s ease .3s both; }
    .ty-title span { color: var(--green); }
    .ty-desc { font-size: 14px; color: var(--gray-lt); line-height: 1.75; max-width: 360px; margin: 0 auto 36px; animation: fadeUp .5s ease .45s both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    /* ── RIPPLE ── */
    .ripple { position: absolute; border-radius: 50%; background: rgba(61,255,110,.15); transform: scale(0); animation: rippleAnim .55s cubic-bezier(0,0,.2,1); pointer-events: none; }
    @keyframes rippleAnim { to{transform:scale(5);opacity:0} }

    /* ── DOPAMINE: card pop on select ── */
    .cand-card.pop { animation: cardPop .3s cubic-bezier(.34,1.56,.64,1); }
    @keyframes cardPop { 0%{transform:scale(1)} 50%{transform:scale(1.06)} 100%{transform:scale(1)} }

    /* ── DOPAMINE: progress pulse ── */
    .progress-bar-fill.pulse { animation: barPulse .4s ease; }
    @keyframes barPulse { 0%,100%{box-shadow:0 0 10px var(--green-glow)} 50%{box-shadow:0 0 22px var(--green)} }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 99px; }

    @media (max-width: 520px) {
      .hero { grid-template-columns: 1fr; gap: 20px; }
      .welcome-title { font-size: clamp(34px,10vw,46px); letter-spacing: -2px; }
      .cand-grid { grid-template-columns: repeat(2,1fr); }
    }
    @media (min-width: 600px) {
      .cand-grid { grid-template-columns: repeat(3,1fr); }
    }
  </style>
</head>

function shuffleAll(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }
function pinnedShuffle(arr, pin){
  const rest=arr.filter(c=>c!==pin); shuffleAll(rest);
  rest.splice(1,0,pin); return rest;
}
function equalizeCards(gridId){
  requestAnimationFrame(()=>{
    const cards=document.querySelectorAll(`#${gridId} .cand-card`);
    if(!cards.length) return;
    cards.forEach(c=>c.style.height='auto');
    let max=0; cards.forEach(c=>{if(c.offsetHeight>max)max=c.offsetHeight;});
    cards.forEach(c=>c.style.height=max+'px');
  });
}
function ripple(e,el){
  const r=document.createElement('span'); r.className='ripple';
  const rect=el.getBoundingClientRect(), size=Math.max(rect.width,rect.height);
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left-size/2;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top-size/2;
  r.style.cssText=`width:${size}px;height:${size}px;left:${cx}px;top:${cy}px`;
  el.appendChild(r); setTimeout(()=>r.remove(),550);
}

let _tt;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2400);
}

const app=document.getElementById('app');
const SCREENS=[renderWelcome,renderQ1,renderQ2,renderQ3,renderQ4,renderThanks];

function goTo(n){
  const cur=app.querySelector('.screen');
  if(cur){cur.classList.add('out');setTimeout(()=>{app.innerHTML='';SCREENS[n]();window.scrollTo({top:0,behavior:'smooth'});},180);}
  else SCREENS[n]();
}

function updateProgress(step){
  const pw=document.getElementById('progressWrap');
  if(step===0){pw.style.display='none';return;}
  pw.style.display='block';
  const pct=Math.round((step/4)*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('stepLabel').textContent=`Pregunta ${step} de 4`;
  document.getElementById('stepPct').textContent=pct+'%';
}

/* ── ACCIONES ── */
function pulseBar(){
  const f=document.getElementById('progressFill');
  if(!f) return;
  f.classList.remove('pulse');
  requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.add('pulse')));
  setTimeout(()=>f.classList.remove('pulse'),450);
}

function toggleCand(e,el,key,cntId,btnId,gridId){
  const name=el.dataset.name, idx=state[key].indexOf(name);
  if(idx===-1){
    if(state[key].length>=MAX){ showToast('Solo son 3 — ya completaste esta pregunta ✓'); return; }
    state[key].push(name); el.classList.add('selected'); ripple(e,el);
    el.classList.remove('pop'); requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('pop')));
    pulseBar();
    if(state[key].length===MAX) showToast('Solo son 3 — ya completaste esta pregunta ✓');
  } else {
    state[key].splice(idx,1); el.classList.remove('selected');
  }
  document.getElementById(cntId).textContent=state[key].length;
  const atMax=state[key].length>=MAX;
  document.querySelectorAll(`#${gridId} .cand-card`).forEach(c=>{
    if(atMax&&!state[key].includes(c.dataset.name)) c.classList.add('maxed');
    else c.classList.remove('maxed');
  });
  const btn=document.getElementById(btnId); if(btn) btn.disabled=state[key].length===0;
}

function selectParty(e,el,key,groupId,btnId){
  ripple(e,el);
  document.querySelectorAll(`#${groupId} .party-card`).forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected'); state[key]=el.dataset.val;
  pulseBar();
  const wrap=document.getElementById('otroWrap');
  if(wrap){
    const isOtro=el.dataset.val==='Otro';
    wrap.style.display=isOtro?'block':'none';
    if(isOtro){ setTimeout(()=>{ const i=document.getElementById('otroText'); if(i) i.focus(); },80); }
  }
  const btn=document.getElementById(btnId);
  if(btn) btn.disabled=(el.dataset.val==='Otro'&&!state.q3Other);
}

function onOtroInput(val){
  state.q3Other=val.trim();
  const btn=document.getElementById('nb3');
  if(btn) btn.disabled=!state.q3Other;
}

function selectVote(e,el){
  ripple(e,el);
  document.querySelectorAll('#voteGrid .cand-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected'); state.q4=el.dataset.name;
  el.classList.remove('pop'); requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('pop')));
  pulseBar();
  const btn=document.getElementById('nb4'); if(btn) btn.disabled=false;
}

function resetSurvey(){
  Object.assign(state,{step:0,q1:[],q2:[],q3:null,q3Other:null,q4:null,
    o1:shuffleAll([...CANDIDATES]),o2:shuffleAll([...CANDIDATES]),
    o4:pinnedShuffle([...CANDIDATES],"Toño Guzmán")});
  goTo(0);
}

renderWelcome();
</script>
</body>
</html>
