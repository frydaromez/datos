<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Encuesta Ciudadana León | Datos GTO</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --bg:        #0a0a0a;
      --surface:   #141414;
      --card:      #1c1c1c;
      --card-ho:   #242424;
      --green:     #3dff6e;
      --green-dim: #1a7a33;
      --green-glow:#3dff6e44;
      --white:     #f5f5f5;
      --gray:      #888;
      --border:    #2a2a2a;
      --radius:    16px;
      --trans:     0.22s cubic-bezier(.4,0,.2,1);
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left:   env(safe-area-inset-left, 0px);
      --safe-right:  env(safe-area-inset-right, 0px);
    }

    html {
      height: -webkit-fill-available;
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(var(--safe-top) + 0px) calc(var(--safe-right) + 16px) calc(var(--safe-bottom) + 72px) calc(var(--safe-left) + 16px);
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
    }

    /* ── TOP BAR ── */
    .topbar {
      width: 100%;
      max-width: 640px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 18px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-circle {
      width: 36px; height: 36px;
      background: #000;
      border: 2px solid var(--green);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
    }
    .logo-text { font-weight: 800; font-size: 14px; letter-spacing: 1px; }
    .logo-text span { color: var(--green); }

    /* ── PROGRESS ── */
    .progress-wrap {
      width: 100%;
      max-width: 640px;
      margin-bottom: 28px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--gray);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .6px;
    }
    .step-label { color: var(--green); }
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green-dim), var(--green));
      border-radius: 99px;
      transition: width .55s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 0 12px var(--green-glow);
    }

    /* ── SCREENS ── */
    .screen {
      width: 100%;
      max-width: 640px;
      animation: slideIn .32s cubic-bezier(.4,0,.2,1);
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(32px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .screen.out {
      animation: slideOut .22s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes slideOut {
      to { opacity: 0; transform: translateX(-32px); }
    }

    /* ── WELCOME ── */
    .welcome-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--green-glow);
      border: 1px solid var(--green-dim);
      color: var(--green);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      padding: 7px 14px;
      border-radius: 99px;
      margin-bottom: 22px;
    }
    .badge-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: blink 1.5s ease infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    .welcome-title {
      font-size: clamp(30px, 7vw, 46px);
      font-weight: 900;
      line-height: 1.08;
      margin-bottom: 18px;
      letter-spacing: -1.5px;
    }
    .welcome-title .hl { color: var(--green); }

    .welcome-desc {
      font-size: 15px;
      color: #aaa;
      line-height: 1.75;
      margin-bottom: 26px;
      font-weight: 400;
    }

    .privacy-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--green);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 28px;
      display: flex;
      gap: 13px;
      align-items: flex-start;
    }
    .privacy-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .privacy-text { font-size: 13px; color: #bbb; line-height: 1.65; font-weight: 400; }
    .privacy-text strong { color: var(--white); font-weight: 700; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 10px;
      text-align: center;
    }
    .stat-num { font-size: 22px; font-weight: 900; color: var(--green); }
    .stat-label { font-size: 10px; color: var(--gray); margin-top: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }

    /* ── QUESTION HEADER ── */
    .q-number {
      font-size: 10px;
      font-weight: 700;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .q-title {
      font-size: clamp(17px, 4vw, 22px);
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .q-subtitle {
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 24px;
      font-weight: 500;
    }
    .sel-count { color: var(--green); font-weight: 700; }

    /* ── CANDIDATE GRID ── */
    .candidates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 9px;
      margin-bottom: 28px;
    }
    .candidate-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      cursor: pointer;
      transition: border-color var(--trans), background var(--trans), box-shadow var(--trans), transform .12s ease;
      position: relative;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .candidate-card:active { transform: scale(0.96); }

    .candidate-card.selected {
      background: #0d2b17;
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green), 0 4px 18px var(--green-glow);
    }
    .candidate-card.selected .c-check { opacity: 1; transform: scale(1) rotate(0deg); }
    .candidate-card.selected .c-name { color: var(--green); }
    .candidate-card.selected .c-initial { background: var(--green-dim); color: var(--green); }

    .c-check {
      position: absolute;
      top: 9px; right: 9px;
      width: 20px; height: 20px;
      background: var(--green);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 900;
      color: #000;
      opacity: 0;
      transform: scale(0.3) rotate(-90deg);
      transition: all .3s cubic-bezier(.34,1.56,.64,1);
    }
    .c-initial {
      width: 34px; height: 34px;
      background: var(--border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: var(--gray);
      margin-bottom: 9px;
      transition: all var(--trans);
    }
    .c-name { font-size: 12px; font-weight: 600; line-height: 1.35; transition: color var(--trans); }

    /* ── PARTY CARDS ── */
    .party-options { display: grid; gap: 10px; margin-bottom: 24px; }
    .party-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color var(--trans), background var(--trans), box-shadow var(--trans), transform .12s ease;
      display: flex;
      align-items: center;
      gap: 14px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .party-card:active { transform: scale(0.97); }
    .party-card.selected {
      background: #0d2b17;
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green), 0 4px 18px var(--green-glow);
    }
    .party-card.selected .p-radio { background: var(--green); border-color: var(--green); }
    .party-card.selected .p-radio::after { opacity: 1; transform: scale(1); }
    .party-card.selected .p-name { color: var(--green); }

    .p-radio {
      width: 22px; height: 22px;
      border: 2px solid #444;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--trans);
    }
    .p-radio::after {
      content: '';
      width: 8px; height: 8px;
      background: #000;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      transition: all .22s cubic-bezier(.34,1.56,.64,1);
    }
    .p-color {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .p-name { font-size: 14px; font-weight: 700; transition: color var(--trans); }
    .p-desc { font-size: 11px; color: var(--gray); margin-top: 2px; font-weight: 400; }

    /* ── DIVIDER ── */
    .section-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0 22px;
    }
    .section-divider::before, .section-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .section-divider span {
      font-size: 10px; color: var(--gray); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    }

    /* ── VOTE OPTIONS ── */
    .vote-options { display: grid; gap: 9px; margin-bottom: 28px; }
    .vote-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 18px;
      cursor: pointer;
      transition: border-color var(--trans), background var(--trans), box-shadow var(--trans), transform .12s ease;
      display: flex;
      align-items: center;
      gap: 14px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .vote-card:active { transform: scale(0.97); }
    .vote-card.selected {
      background: #0d2b17;
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green), 0 4px 18px var(--green-glow);
    }
    .vote-card.selected .p-radio { background: var(--green); border-color: var(--green); }
    .vote-card.selected .p-radio::after { opacity: 1; transform: scale(1); }
    .vote-card.selected .v-name { color: var(--green); }
    .v-num {
      width: 30px; height: 30px;
      background: var(--border);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: var(--gray);
      flex-shrink: 0;
      transition: all var(--trans);
    }
    .vote-card.selected .v-num { background: var(--green-dim); color: var(--green); }
    .v-name { font-size: 14px; font-weight: 600; transition: color var(--trans); flex: 1; }

    /* ── DUAL NOTE ── */
    .dual-note {
      background: #111;
      border: 1px dashed #2e2e2e;
      border-radius: 10px;
      padding: 11px 15px;
      font-size: 11px;
      color: #555;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    /* ── BUTTONS ── */
    .btn-row { display: flex; gap: 10px; align-items: center; }
    .btn-primary {
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 17px 28px;
      font-family: 'Montserrat', -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity .15s, transform .12s ease, box-shadow .2s;
      letter-spacing: .4px;
      text-transform: uppercase;
      flex: 1;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 54px;
    }
    .btn-primary:active { transform: scale(0.96); opacity: .9; }
    .btn-primary:disabled { opacity: .3; pointer-events: none; }

    .btn-back {
      background: transparent;
      color: var(--gray);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 17px 18px;
      font-family: 'Montserrat', -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color var(--trans), color var(--trans), transform .12s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 54px;
    }
    .btn-back:active { transform: scale(0.96); border-color: var(--gray); color: var(--white); }

    /* ── THANK YOU ── */
    .ty-screen { text-align: center; padding: 32px 0 0; }
    .ty-icon {
      width: 76px; height: 76px;
      background: #0d2b17;
      border: 2px solid var(--green);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px;
      margin: 0 auto 24px;
      animation: popIn .5s cubic-bezier(.34,1.56,.64,1) .1s both;
    }
    @keyframes popIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
    .ty-title { font-size: clamp(26px,6vw,36px); font-weight: 900; margin-bottom: 10px; letter-spacing: -1px; }
    .ty-title span { color: var(--green); }
    .ty-desc { font-size: 14px; color: #aaa; line-height: 1.7; max-width: 360px; margin: 0 auto 28px; }
    .ty-divider { width: 36px; height: 3px; background: var(--green); border-radius: 99px; margin: 0 auto 28px; }

    .summary-grid { display: grid; gap: 10px; text-align: left; margin-bottom: 32px; }
    .summary-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--green-dim);
      border-radius: var(--radius);
      padding: 13px 16px;
    }
    .s-label { font-size: 10px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 4px; }
    .s-value { font-size: 13px; font-weight: 600; color: var(--white); line-height: 1.5; }
    .s-count { color: var(--green); font-weight: 700; }
    .s-names { color: var(--gray); font-size: 11px; font-weight: 400; margin-top: 3px; line-height: 1.6; }

    .powered { margin-top: 44px; font-size: 11px; color: #3a3a3a; text-align: center; letter-spacing: .5px; }
    .powered span { color: var(--green); font-weight: 700; }

    /* ── RIPPLE ── */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(61,255,110,.15);
      transform: scale(0);
      animation: rippleAnim .55s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 400px) {
      .candidates-grid { grid-template-columns: repeat(2, 1fr); }
      .welcome-title { letter-spacing: -1px; }
    }
    @media (min-width: 600px) {
      .candidates-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-circle">🐻</div>
    <div class="logo-text">DATOS<span>GTO</span></div>
  </div>
  <div style="font-size:11px;color:var(--gray);font-weight:600;letter-spacing:.5px;">León · 2025</div>
</div>

<!-- PROGRESS -->
<div class="progress-wrap" id="progressWrap" style="display:none;">
  <div class="progress-meta">
    <span class="step-label" id="stepLabel">Pregunta 1 de 5</span>
    <span id="stepPct">20%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<!-- MAIN -->
<div id="app"></div>

<div class="powered">Impulsado por <span>Datos GTO</span> · Especialistas en Datos desde 1970</div>

<script>
/* ── DATA ── */
const CANDIDATES = [
  "Toño Guzmán","Alan Márquez","Luis Ernesto Ayala Torres","Jorge Jiménez Lona",
  "Jorge Espadas Galván","Antares Vázquez Alatorre","Enrique Alba Martínez",
  "Bárbara Botello","Vanessa Montes de Oca","José Luis Manrique Hernández",
  "Juan Pablo Delgado","Dessire Ángel Rocha","Mauricio Battaglia Velázquez",
  "Arturo Sánchez Castellanos","Kikis Magaña"
];

const PARTIES = [
  { abbr:"PAN",          name:"Partido Acción Nacional",      color:"#003DA5", emoji:"🔵" },
  { abbr:"MORENA",       name:"Morena",                       color:"#8B1A1A", emoji:"🔴" },
  { abbr:"MC",           name:"Movimiento Ciudadano",         color:"#FF6200", emoji:"🟠" },
  { abbr:"Partido Verde",name:"Partido Verde Ecologista",     color:"#2E7D32", emoji:"🟢" }
];

/* ── STATE ── */
const state = {
  step: 0,
  q1: [], q2: [], q3a: null, q3b: null, q4: null,
  order1: shuffle([...CANDIDATES]),
  order2: shuffle([...CANDIDATES]),
  order4: shuffle([...CANDIDATES])
};

/* ── UTILS ── */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initials(name) {
  return name.split(' ').filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();
}

function ripple(e, el) {
  const r = document.createElement('span');
  r.className = 'ripple';
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left - size / 2;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top  - size / 2;
  r.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px`;
  el.appendChild(r);
  setTimeout(() => r.remove(), 600);
}

/* ── PROGRESS ── */
function updateProgress(step) {
  const pw = document.getElementById('progressWrap');
  if (step === 0) { pw.style.display = 'none'; return; }
  pw.style.display = 'block';
  const pct = Math.round((step / 5) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('stepLabel').textContent = `Pregunta ${step} de 5`;
  document.getElementById('stepPct').textContent = pct + '%';
}

/* ── NAVIGATION ── */
const app = document.getElementById('app');
const SCREENS = [renderWelcome, renderQ1, renderQ2, renderQ3, renderQ4, renderThanks];

function goTo(n) {
  const cur = app.querySelector('.screen');
  if (cur) {
    cur.classList.add('out');
    setTimeout(() => { app.innerHTML = ''; SCREENS[n](); scrollToTop(); }, 220);
  } else {
    SCREENS[n]();
  }
}

function scrollToTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── SCREEN 0: WELCOME ── */
function renderWelcome() {
  state.step = 0;
  updateProgress(0);
  app.innerHTML = `
    <div class="screen">
      <div class="welcome-badge">
        <span class="badge-dot"></span>
        Encuesta activa
      </div>
      <h1 class="welcome-title">¿Quién debe<br>gobernar<br><span class="hl">León?</span></h1>
      <p class="welcome-desc">
        Queremos conocer tu opinión sobre los candidatos para la Presidencia Municipal.
        Son <strong style="color:var(--white)">5 preguntas rápidas</strong> — menos de 3 minutos.
      </p>

      <div class="privacy-box">
        <div class="privacy-icon">🔒</div>
        <div class="privacy-text">
          <strong>Tus respuestas son 100% anónimas.</strong>
          No pedimos tu nombre, teléfono ni ningún dato personal.
          Esta información se usa únicamente para análisis ciudadano y nunca será vinculada a tu identidad.
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-num">15</div>
          <div class="stat-label">Candidatos</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">5</div>
          <div class="stat-label">Preguntas</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">&lt;3'</div>
          <div class="stat-label">Duración</div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-primary" onclick="goTo(1)">Comenzar encuesta →</button>
      </div>
    </div>

}

      </div>
      <button class="btn-primary" onclick="resetSurvey()">Nueva respuesta</button>

/* ── ACTIONS ── */
function toggleCand(e, el, key, cntId, btnId) {
  ripple(e, el);
  const name = el.dataset.name;
  const idx = state[key].indexOf(name);
  if (idx === -1) { state[key].push(name); el.classList.add('selected'); }
  else            { state[key].splice(idx, 1); el.classList.remove('selected'); }
  document.getElementById(cntId).textContent = state[key].length + ' seleccionados';
  const btn = document.getElementById(btnId);
  if (btn) btn.disabled = state[key].length === 0;
}

function selectParty(e, el, key, groupId) {
  ripple(e, el);
  document.querySelectorAll(`#${groupId} .party-card`).forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  state[key] = el.dataset.val;
  const btn = document.getElementById('nextBtn3');
  if (btn) btn.disabled = !(state.q3a && state.q3b);
}

function selectVote(e, el) {
  ripple(e, el);
  document.querySelectorAll('#voteGrid .vote-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  state.q4 = el.dataset.val;
  const btn = document.getElementById('nextBtn4');
  if (btn) btn.disabled = false;
}

function resetSurvey() {
  Object.assign(state, {
    step: 0, q1: [], q2: [], q3a: null, q3b: null, q4: null,
    order1: shuffle([...CANDIDATES]),
    order2: shuffle([...CANDIDATES]),
    order4: shuffle([...CANDIDATES])
  });
  goTo(0);
}

renderWelcome();
