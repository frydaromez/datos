<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Encuesta Ciudadana León 2026 | El Bajío en Datos</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    :root {
      --bg:        #0a0a0a;
      --surface:   #141414;
      --card:      #1c1c1c;
      --green:     #3dff6e;
      --green-dim: #1a7a33;
      --green-glow:#3dff6e33;
      --white:     #f5f5f5;
      --gray:      #777;
      --gray-lt:   #aaa;
      --border:    #242424;
      --radius:    14px;
      --trans:     0.22s cubic-bezier(.4,0,.2,1);
    }
    html { height: -webkit-fill-available; scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex; flex-direction: column; align-items: center;
      padding: calc(env(safe-area-inset-top,0px) + 0px)
               calc(env(safe-area-inset-right,0px) + 20px)
               calc(env(safe-area-inset-bottom,0px) + 60px)
               calc(env(safe-area-inset-left,0px) + 20px);
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
    }

    /* ══════════════════════════════
       TOP BAR
    ══════════════════════════════ */
    .topbar {
      width: 100%; max-width: 680px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 0 24px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
    }
    .logo-mark {
      width: 38px; height: 38px;
      background: var(--green);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 900; color: #000;
      letter-spacing: -.5px; flex-shrink: 0;
    }
    .logo-text-wrap { display: flex; flex-direction: column; line-height: 1.1; }
    .logo-name { font-size: 13px; font-weight: 800; color: var(--white); letter-spacing: .2px; }
    .logo-sub  { font-size: 10px; font-weight: 500; color: var(--gray); letter-spacing: .3px; }

    .badge-live {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--green-glow);
      border: 1px solid var(--green-dim);
      color: var(--green);
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.6px;
      padding: 7px 13px; border-radius: 99px;
      flex-shrink: 0;
    }
    .badge-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: blink 1.5s ease infinite; flex-shrink: 0; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ══════════════════════════════
       PROGRESS
    ══════════════════════════════ */
    .progress-wrap { width: 100%; max-width: 680px; margin-bottom: 28px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--gray); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .6px; }
    .step-label { color: var(--green); }
    .progress-bar-bg { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green-dim), var(--green)); border-radius: 99px; transition: width .55s cubic-bezier(.4,0,.2,1); box-shadow: 0 0 10px var(--green-glow); }

    /* ══════════════════════════════
       SCREENS
    ══════════════════════════════ */
    .screen { width: 100%; max-width: 680px; animation: slideIn .32s cubic-bezier(.4,0,.2,1); }
    @keyframes slideIn { from{opacity:0;transform:translateX(28px)} to{opacity:1;transform:translateX(0)} }
    .screen.out { animation: slideOut .2s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes slideOut { to{opacity:0;transform:translateX(-28px)} }

    /* ══════════════════════════════
       WELCOME — 2-COLUMN HERO
    ══════════════════════════════ */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: stretch;
      margin-bottom: 28px;
    }

    /* LEFT: big title */
    .hero-title-col {
      display: flex; align-items: stretch;
    }
    .welcome-title {
      font-size: clamp(32px, 5.5vw, 52px);
      font-weight: 900;
      line-height: 1.06;
      letter-spacing: -2px;
      color: var(--white);
      display: flex; align-items: center;
    }

    /* RIGHT: info column */
    .hero-info-col {
      display: flex; flex-direction: column; gap: 10px;
    }
    .info-desc {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 16px;
      font-size: 13px; font-weight: 500; color: var(--gray-lt); line-height: 1.6;
      flex: 1;
    }
    .stat-chips {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 12px;
      text-align: center;
    }
    .stat-chip-num  { font-size: 22px; font-weight: 900; color: var(--green); line-height: 1; }
    .stat-chip-label{ font-size: 10px; font-weight: 600; color: var(--gray); margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }

    /* CTA + PRIVACY */
    .cta-block { margin-bottom: 0; }
    .privacy-note {
      margin-top: 16px;
      font-size: 11.5px; color: #4a4a4a; line-height: 1.8;
      font-weight: 400;
      padding: 0 2px;
    }
    .privacy-note strong { color: #666; font-weight: 600; }

    /* ══════════════════════════════
       Q HEADER
    ══════════════════════════════ */
    .q-number { font-size: 10px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
    .q-title  { font-size: clamp(17px,3.8vw,22px); font-weight: 800; line-height: 1.35; margin-bottom: 8px; }
    .q-sub    { font-size: 12.5px; color: var(--gray); margin-bottom: 22px; font-weight: 500; }
    .sel-count{ color: var(--green); font-weight: 700; }
    .max-note { color: #ff6b6b; font-weight: 700; }

    /* ══════════════════════════════
       CANDIDATE GRID
    ══════════════════════════════ */
    .cand-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px,1fr));
      gap: 8px; margin-bottom: 26px;
    }
    .cand-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 12px 13px;
      cursor: pointer; position: relative; overflow: hidden;
      transition: border-color var(--trans), background var(--trans), box-shadow var(--trans), transform .12s ease;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .cand-card:active { transform: scale(0.955); }
    .cand-card.selected {
      background: #0d2b17; border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green), 0 4px 16px var(--green-glow);
    }
    .cand-card.maxed:not(.selected) { opacity: .3; pointer-events: none; }
    .cand-card.selected .c-check { opacity: 1; transform: scale(1) rotate(0deg); }
    .cand-card.selected .c-name  { color: var(--green); }
    .cand-card.selected .c-init  { background: var(--green-dim); color: var(--green); }

    .c-check {
      position: absolute; top: 8px; right: 8px;
      width: 19px; height: 19px; background: var(--green);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 900; color: #000;
      opacity: 0; transform: scale(0.3) rotate(-90deg);
      transition: all .28s cubic-bezier(.34,1.56,.64,1);
    }
    .c-init {
      width: 32px; height: 32px; background: var(--border); border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; color: var(--gray);
      margin-bottom: 8px; transition: all var(--trans); flex-shrink: 0;
    }
    .c-name { font-size: 11.5px; font-weight: 600; line-height: 1.35; transition: color var(--trans); }

    /* ══════════════════════════════
       PARTY CARDS
    ══════════════════════════════ */
    .party-list { display: grid; gap: 9px; margin-bottom: 24px; }
    .party-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 15px 17px;
      cursor: pointer;
      transition: border-color var(--trans), background var(--trans), box-shadow var(--trans), transform .12s ease;
      display: flex; align-items: center; gap: 13px;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .party-card:active { transform: scale(0.97); }
    .party-card.selected { background: #0d2b17; border-color: var(--green); box-shadow: 0 0 0 1px var(--green), 0 4px 16px var(--green-glow); }
    .party-card.selected .p-radio { background: var(--green); border-color: var(--green); }
    .party-card.selected .p-radio::after { opacity: 1; transform: scale(1); }
    .party-card.selected .p-name { color: var(--green); }

    .p-radio {
      width: 21px; height: 21px; border: 2px solid #3a3a3a; border-radius: 50%;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: all var(--trans);
    }
    .p-radio::after { content: ''; width: 7px; height: 7px; background: #000; border-radius: 50%; opacity: 0; transform: scale(0); transition: all .22s cubic-bezier(.34,1.56,.64,1); }
    .p-emoji { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .p-name  { font-size: 14px; font-weight: 700; transition: color var(--trans); }
    .p-desc  { font-size: 11px; color: var(--gray); margin-top: 1px; font-weight: 400; }

    /* ══════════════════════════════
       VOTE OPTIONS
    ══════════════════════════════ */
    .vote-list { display: grid; gap: 8px; margin-bottom: 26px; }
    .vote-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 14px 17px; cursor: pointer;
      transition: border-color var(--trans), background var(--trans), box-shadow var(--trans), transform .12s ease;
      display: flex; align-items: center; gap: 13px;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .vote-card:active { transform: scale(0.97); }
    .vote-card.selected { background: #0d2b17; border-color: var(--green); box-shadow: 0 0 0 1px var(--green), 0 4px 16px var(--green-glow); }
    .vote-card.selected .p-radio { background: var(--green); border-color: var(--green); }
    .vote-card.selected .p-radio::after { opacity: 1; transform: scale(1); }
    .vote-card.selected .v-name { color: var(--green); }
    .vote-card.selected .v-num  { background: var(--green-dim); color: var(--green); }
    .v-num  { width: 28px; height: 28px; background: var(--border); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--gray); flex-shrink: 0; transition: all var(--trans); }
    .v-name { font-size: 13.5px; font-weight: 600; transition: color var(--trans); flex: 1; }

    /* ══════════════════════════════
       BUTTONS
    ══════════════════════════════ */
    .btn-row { display: flex; gap: 10px; align-items: center; }
    .btn-primary {
      background: var(--green); color: #000; border: none; border-radius: 13px;
      padding: 17px 24px; font-family: 'Montserrat', -apple-system, sans-serif;
      font-size: 13.5px; font-weight: 800; cursor: pointer; letter-spacing: .3px;
      text-transform: uppercase; flex: 1; min-height: 54px;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: opacity .15s, transform .12s ease;
    }
    .btn-primary:active { transform: scale(0.96); opacity: .88; }
    .btn-primary:disabled { opacity: .25; pointer-events: none; }
    .btn-back {
      background: transparent; color: var(--gray); border: 1.5px solid var(--border);
      border-radius: 13px; padding: 17px 17px; font-family: 'Montserrat', -apple-system, sans-serif;
      font-size: 13px; font-weight: 600; cursor: pointer; min-height: 54px;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: border-color var(--trans), color var(--trans), transform .12s ease;
    }
    .btn-back:active { transform: scale(0.96); border-color: #555; color: var(--white); }

    /* ══════════════════════════════
       THANK YOU
    ══════════════════════════════ */
    .ty-screen { text-align: center; padding: 28px 0 0; }
    .ty-icon { width: 72px; height: 72px; background: #0d2b17; border: 2px solid var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 22px; animation: popIn .45s cubic-bezier(.34,1.56,.64,1) .08s both; }
    @keyframes popIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
    .ty-title { font-size: clamp(24px,5.5vw,34px); font-weight: 900; margin-bottom: 10px; letter-spacing: -1px; }
    .ty-title span { color: var(--green); }
    .ty-desc { font-size: 13.5px; color: var(--gray-lt); line-height: 1.7; max-width: 340px; margin: 0 auto 24px; }
    .ty-line { width: 32px; height: 3px; background: var(--green); border-radius: 99px; margin: 0 auto 24px; }
    .sum-grid { display: grid; gap: 9px; text-align: left; margin-bottom: 28px; }
    .sum-item { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--green-dim); border-radius: var(--radius); padding: 12px 15px; }
    .s-lbl { font-size: 9.5px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 3px; }
    .s-val { font-size: 13px; font-weight: 600; color: var(--white); }
    .s-cnt { color: var(--green); }
    .s-names { color: var(--gray); font-size: 11px; font-weight: 400; margin-top: 3px; line-height: 1.6; }

    /* ══════════════════════════════
       RIPPLE
    ══════════════════════════════ */
    .ripple { position: absolute; border-radius: 50%; background: rgba(61,255,110,.13); transform: scale(0); animation: rippleAnim .5s linear; pointer-events: none; }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 99px; }

    /* ══════════════════════════════
       RESPONSIVE
    ══════════════════════════════ */
    @media (max-width: 540px) {
      .hero { grid-template-columns: 1fr; gap: 16px; }
      .welcome-title { font-size: clamp(34px, 10vw, 46px); align-items: flex-start; }
      .stat-chips { grid-template-columns: 1fr 1fr; }
      .cand-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 541px) and (max-width: 680px) {
      .welcome-title { font-size: clamp(28px, 5vw, 40px); }
    }
    @media (min-width: 640px) {
      .cand-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-mark">BD</div>
    <div class="logo-text-wrap">
      <span class="logo-name">El Bajío en Datos</span>
      <span class="logo-sub">León, Guanajuato</span>
    </div>
  </div>
  <div class="badge-live">
    <span class="badge-dot"></span>
    Encuesta activa
  </div>
</div>

<!-- PROGRESS (hidden on welcome) -->
<div class="progress-wrap" id="progressWrap" style="display:none;">
  <div class="progress-meta">
    <span class="step-label" id="stepLabel">Pregunta 1 de 4</span>
    <span id="stepPct">25%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div id="app"></div>

<script>
/* ── DATA ── */
const CANDIDATES = [
  "Toño Guzmán","Alan Márquez","Luis Ernesto Ayala Torres","Jorge Jiménez Lona",
  "Jorge Espadas Galván","Antares Vázquez Alatorre","Enrique Alba Martínez",
  "Bárbara Botello","Vanessa Montes de Oca","José Luis Manrique Hernández",
  "Juan Pablo Delgado","Dessire Ángel Rocha","Mauricio Battaglia Velázquez",
  "Arturo Sánchez Castellanos","Kikis Magaña"
];
const PARTIES = [
  {abbr:"PAN",          name:"Partido Acción Nacional",  color:"#003DA5", emoji:"🔵"},
  {abbr:"MORENA",       name:"Morena",                   color:"#8B1A1A", emoji:"🔴"},
  {abbr:"MC",           name:"Movimiento Ciudadano",     color:"#FF6200", emoji:"🟠"},
  {abbr:"Partido Verde",name:"Partido Verde Ecologista", color:"#2E7D32", emoji:"🟢"}
];
const MAX_Q2 = 3;

/* ── STATE ── */
const state = {
  step:0, q1:[], q2:[], q3:null, q4:null,
  o1: shuffle([...CANDIDATES]),
  o2: shuffle([...CANDIDATES]),
  o4: shuffle([...CANDIDATES])
};

function shuffle(a) {
  for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function initials(n){ return n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function ripple(e, el) {
  const r=document.createElement('span'); r.className='ripple';
  const rect=el.getBoundingClientRect(), size=Math.max(rect.width,rect.height);
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left-size/2;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top-size/2;
  r.style.cssText=`width:${size}px;height:${size}px;left:${cx}px;top:${cy}px`;
  el.appendChild(r); setTimeout(()=>r.remove(),550);
}

/* ── NAV ── */
const app = document.getElementById('app');
const SCREENS = [renderWelcome,renderQ1,renderQ2,renderQ3,renderQ4,renderThanks];

function goTo(n) {
  const cur = app.querySelector('.screen');
  if (cur) { cur.classList.add('out'); setTimeout(()=>{app.innerHTML='';SCREENS[n]();window.scrollTo({top:0,behavior:'smooth'});},200); }
  else SCREENS[n]();
}

function updateProgress(step) {
  const pw=document.getElementById('progressWrap');
  if(step===0){pw.style.display='none';return;}
  pw.style.display='block';
  const pct=Math.round((step/4)*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('stepLabel').textContent=`Pregunta ${step} de 4`;
  document.getElementById('stepPct').textContent=pct+'%';
}

/* ── WELCOME ── */
function renderWelcome() {
  updateProgress(0);
  app.innerHTML=`
    <div class="screen">

      <div class="hero">
        <!-- LEFT: título grande -->
        <div class="hero-title-col">
          <h1 class="welcome-title">¿Quién debe gobernar León en 2026?</h1>
        </div>

        <!-- RIGHT: descripción + stats -->
        <div class="hero-info-col">
          <div class="info-desc">
            Queremos conocer tu opinión sobre los candidatos para la <strong style="color:var(--white)">Presidencia Municipal de León.</strong>
          </div>
          <div class="stat-chips">
            <div class="stat-chip">
              <div class="stat-chip-num">4</div>
              <div class="stat-chip-label">Preguntas</div>
            </div>
            <div class="stat-chip">
              <div class="stat-chip-num">&lt;3'</div>
              <div class="stat-chip-label">Minutos</div>
            </div>
          </div>
        </div>
      </div>

      <div class="cta-block">
        <div class="btn-row">
          <button class="btn-primary" onclick="goTo(1)">Comenzar encuesta →</button>
        </div>
        <p class="privacy-note">
          <strong>Tus respuestas son 100% anónimas.</strong> No pedimos tu nombre, teléfono ni ningún dato personal.<br>
          Esta información se usa únicamente para análisis ciudadano y nunca será vinculada a tu identidad.
        </p>
      </div>

    </div>`;
}

/* ── Q1: RECONOCIMIENTO ── */
function renderQ1() {
  state.step=1; updateProgress(1);
  app.innerHTML=`
    <div class="screen">
      <div class="q-number">Pregunta 1 de 4 · Reconocimiento</div>
      <h2 class="q-title">"De los siguientes personajes públicos en León, ¿a quiénes conoce o ha escuchado nombrar?"</h2>
      <p class="q-sub">Seleccione todos los que apliquen &nbsp;·&nbsp; <span class="sel-count" id="cnt1">${state.q1.length} seleccionados</span></p>
      <div class="cand-grid" id="grid1">
        ${state.o1.map(c=>`
          <div class="cand-card ${state.q1.includes(c)?'selected':''}" data-name="${c}"
               onclick="toggleCand(event,this,'q1','cnt1','nb1',null)">
            <div class="c-check">✓</div>
            <div class="c-init">${initials(c)}</div>
            <div class="c-name">${c}</div>
          </div>`).join('')}
      </div>
      <div class="btn-row">
        <button class="btn-back" onclick="goTo(0)">← Atrás</button>
        <button class="btn-primary" id="nb1" onclick="goTo(2)" ${state.q1.length===0?'disabled':''}>Siguiente →</button>
      </div>
    </div>`;
}

/* ── Q2: RECHAZO máx 3 ── */
function renderQ2() {
  state.step=2; updateProgress(2);
  const atMax=state.q2.length>=MAX_Q2;
  app.innerHTML=`
    <div class="screen">
      <div class="q-number">Pregunta 2 de 4 · Rechazo</div>
      <h2 class="q-title">"Independientemente de su preferencia política, ¿por cuál de estas personas USTED NUNCA VOTARÍA para la Presidencia Municipal de León?"</h2>
      <p class="q-sub">Máximo 3 opciones &nbsp;·&nbsp; <span class="sel-count" id="cnt2">${state.q2.length}</span>/3 seleccionados${atMax?' &nbsp;<span class="max-note">· Límite alcanzado</span>':''}</p>
      <div class="cand-grid" id="grid2">
        ${state.o2.map(c=>`
          <div class="cand-card ${state.q2.includes(c)?'selected':''} ${atMax&&!state.q2.includes(c)?'maxed':''}"
               data-name="${c}" onclick="toggleCand(event,this,'q2','cnt2','nb2',${MAX_Q2})">
            <div class="c-check">✓</div>
            <div class="c-init">${initials(c)}</div>
            <div class="c-name">${c}</div>
          </div>`).join('')}
      </div>
      <div class="btn-row">
        <button class="btn-back" onclick="goTo(1)">← Atrás</button>
        <button class="btn-primary" id="nb2" onclick="goTo(3)" ${state.q2.length===0?'disabled':''}>Siguiente →</button>
      </div>
    </div>`;
}

/* ── Q3: CONFIANZA PARTIDO ── */
function renderQ3() {
  state.step=3; updateProgress(3);
  app.innerHTML=`
    <div class="screen">
      <div class="q-number">Pregunta 3 de 4 · Posicionamiento</div>
      <h2 class="q-title">"¿En cuál de los siguientes partidos confía más para gobernar León?"</h2>
      <p class="q-sub">Seleccione una opción</p>
      <div class="party-list" id="grpQ3">
        ${PARTIES.map(p=>`
          <div class="party-card ${state.q3===p.abbr?'selected':''}" data-val="${p.abbr}"
               onclick="selectParty(event,this,'q3','grpQ3','nb3')">
            <div class="p-radio"></div>
            <div class="p-emoji" style="background:${p.color}18;border:1px solid ${p.color}35">${p.emoji}</div>
            <div>
              <div class="p-name">${p.abbr}</div>
              <div class="p-desc">${p.name}</div>
            </div>
          </div>`).join('')}
      </div>
      <div class="btn-row">
        <button class="btn-back" onclick="goTo(2)">← Atrás</button>
        <button class="btn-primary" id="nb3" onclick="goTo(4)" ${state.q3?'':'disabled'}>Siguiente →</button>
      </div>
    </div>`;
}

/* ── Q4: INTENCIÓN DE VOTO ── */
function renderQ4() {
  state.step=4; updateProgress(4);
  const list=[...state.o4,"— Ninguno / Anularía mi voto","— Aún no lo he decidido"];
  app.innerHTML=`
    <div class="screen">
      <div class="q-number">Pregunta 4 de 4 · Intención de Voto</div>
      <h2 class="q-title">"Si hoy fueran las elecciones para Presidente Municipal de León, ¿por quién votaría?"</h2>
      <p class="q-sub">Seleccione una opción</p>
      <div class="vote-list" id="voteGrid">
        ${list.map((c,i)=>{
          const extra=c.startsWith('—'), lbl=c.replace('— ','');
          return `<div class="vote-card ${state.q4===c?'selected':''}" data-val="${c}" onclick="selectVote(event,this)">
            <div class="p-radio"></div>
            ${!extra?`<div class="v-num">${String(i+1).padStart(2,'0')}</div>`:`<div style="width:28px;flex-shrink:0"></div>`}
            <div class="v-name">${lbl}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="btn-row">
        <button class="btn-back" onclick="goTo(3)">← Atrás</button>
        <button class="btn-primary" id="nb4" onclick="goTo(5)" ${state.q4?'':'disabled'}>Enviar respuestas →</button>
      </div>
    </div>`;
}

/* ── THANKS ── */
function renderThanks() {
  updateProgress(4);
  setTimeout(()=>{ const f=document.getElementById('progressFill'); if(f) f.style.width='100%'; },50);
  app.innerHTML=`
    <div class="screen ty-screen">
      <div class="ty-icon">✓</div>
      <h2 class="ty-title">¡Gracias por<br><span>participar!</span></h2>
      <p class="ty-desc">Tu opinión ciudadana es valiosa. Tus respuestas quedaron registradas de forma <strong style="color:var(--white)">anónima y confidencial.</strong></p>
      <div class="ty-line"></div>
      <div class="sum-grid">
        <div class="sum-item">
          <div class="s-lbl">P1 · Reconocimiento</div>
          <div class="s-val"><span class="s-cnt">${state.q1.length} reconocido${state.q1.length!==1?'s':''}</span></div>
          ${state.q1.length?`<div class="s-names">${state.q1.join(' · ')}</div>`:''}
        </div>
        <div class="sum-item">
          <div class="s-lbl">P2 · Rechazo</div>
          <div class="s-val"><span class="s-cnt">${state.q2.length?state.q2.length+' seleccionado'+(state.q2.length!==1?'s':''):'Ninguno'}</span></div>
          ${state.q2.length?`<div class="s-names">${state.q2.join(' · ')}</div>`:''}
        </div>
        <div class="sum-item">
          <div class="s-lbl">P3 · Confianza en partido</div>
          <div class="s-val"><span class="s-cnt">${state.q3||'—'}</span></div>
        </div>
        <div class="sum-item">
          <div class="s-lbl">P4 · Intención de voto</div>
          <div class="s-val"><span class="s-cnt">${(state.q4||'—').replace('— ','')}</span></div>
        </div>
      </div>
      <button class="btn-primary" onclick="resetSurvey()">Nueva respuesta</button>
    </div>`;
}

/* ── ACCIONES ── */
function toggleCand(e,el,key,cntId,btnId,maxSel) {
  const name=el.dataset.name, idx=state[key].indexOf(name);
  if(idx===-1){
    if(maxSel&&state[key].length>=maxSel) return;
    state[key].push(name); el.classList.add('selected'); ripple(e,el);
  } else { state[key].splice(idx,1); el.classList.remove('selected'); }
  const cnt=document.getElementById(cntId);
  if(cnt) cnt.textContent=state[key].length;
  if(maxSel){
    const atMax=state[key].length>=maxSel;
    const sub=document.querySelector('.q-sub');
    if(sub) sub.innerHTML=`Máximo 3 opciones &nbsp;·&nbsp; <span class="sel-count" id="cnt2">${state[key].length}</span>/3 seleccionados${atMax?' &nbsp;<span class="max-note">· Límite alcanzado</span>':''}`;
    document.querySelectorAll(`#grid2 .cand-card`).forEach(c=>{
      if(atMax&&!state[key].includes(c.dataset.name)) c.classList.add('maxed');
      else c.classList.remove('maxed');
    });
  }
  const btn=document.getElementById(btnId);
  if(btn) btn.disabled=state[key].length===0;
}

function selectParty(e,el,key,groupId,btnId){
  ripple(e,el);
  document.querySelectorAll(`#${groupId} .party-card`).forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected'); state[key]=el.dataset.val;
  const btn=document.getElementById(btnId); if(btn) btn.disabled=false;
}

function selectVote(e,el){
  ripple(e,el);
  document.querySelectorAll('#voteGrid .vote-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected'); state.q4=el.dataset.val;
  const btn=document.getElementById('nb4'); if(btn) btn.disabled=false;
}

function resetSurvey(){
  Object.assign(state,{step:0,q1:[],q2:[],q3:null,q4:null,
    o1:shuffle([...CANDIDATES]),o2:shuffle([...CANDIDATES]),o4:shuffle([...CANDIDATES])});
  goTo(0);
}

renderWelcome();
</script>
</body>
