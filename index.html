<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encuesta Ciudadana León | Datos GTO</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0a;
      --surface:   #141414;
      --card:      #1c1c1c;
      --card-ho:   #242424;
      --green:     #3dff6e;
      --green-dim: #1a7a33;
      --green-glow:#3dff6e44;
      --white:     #f5f5f5;
      --gray:      #888;
      --border:    #2a2a2a;
      --radius:    14px;
      --trans:     0.28s cubic-bezier(.4,0,.2,1);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 60px;
      overflow-x: hidden;
    }

    /* ── TOP BAR ── */
    .topbar {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0 20px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-circle {
      width: 38px; height: 38px;
      background: #000;
      border: 2px solid var(--green);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .logo-text {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 1px;
      color: var(--white);
    }
    .logo-text span { color: var(--green); }

    /* ── PROGRESS ── */
    .progress-wrap {
      width: 100%;
      max-width: 680px;
      margin-bottom: 32px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--gray);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .progress-meta .step-label { color: var(--green); }
    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green-dim), var(--green));
      border-radius: 99px;
      transition: width .6s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 0 10px var(--green-glow);
    }

    /* ── SCREENS ── */
    .screen {
      width: 100%;
      max-width: 680px;
      animation: slideIn .38s cubic-bezier(.4,0,.2,1);
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .screen.out {
      animation: slideOut .28s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes slideOut {
      to { opacity: 0; transform: translateX(-40px); }
    }

    /* ── WELCOME ── */
    .welcome-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green-glow);
      border: 1px solid var(--green-dim);
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 6px 14px;
      border-radius: 99px;
      margin-bottom: 24px;
    }
    .welcome-badge::before { content: '●'; font-size: 8px; animation: pulse 1.4s ease infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .welcome-title {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }
    .welcome-title .highlight {
      color: var(--green);
      position: relative;
    }

    .welcome-desc {
      font-size: 15px;
      color: #aaa;
      line-height: 1.7;
      margin-bottom: 28px;
      font-weight: 400;
    }

    .privacy-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--green);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 36px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .privacy-icon { font-size: 22px; flex-shrink: 0; margin-top: 2px; }
    .privacy-text { font-size: 13px; color: #bbb; line-height: 1.6; font-weight: 400; }
    .privacy-text strong { color: var(--white); font-weight: 600; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 36px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
    }
    .stat-num { font-size: 24px; font-weight: 800; color: var(--green); }
    .stat-label { font-size: 11px; color: var(--gray); margin-top: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }

    /* ── QUESTION ── */
    .q-number {
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .q-title {
      font-size: clamp(18px, 3.5vw, 24px);
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .q-subtitle {
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 28px;
      font-weight: 400;
    }
    .q-subtitle .sel-count {
      color: var(--green);
      font-weight: 700;
    }

    /* ── CANDIDATE GRID ── */
    .candidates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
      margin-bottom: 32px;
    }
    .candidate-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      cursor: pointer;
      transition: all var(--trans);
      position: relative;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .candidate-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--rx,50%) var(--ry,50%), var(--green-glow), transparent 60%);
      opacity: 0;
      transition: opacity var(--trans);
    }
    .candidate-card:hover { background: var(--card-ho); border-color: #3a3a3a; transform: translateY(-1px); }
    .candidate-card:hover::after { opacity: 1; }
    .candidate-card.selected {
      background: #0d2b17;
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green), 0 4px 20px var(--green-glow);
    }
    .candidate-card.selected .c-check { opacity: 1; transform: scale(1) rotate(0deg); }
    .candidate-card.selected .c-name { color: var(--green); }

    .c-check {
      position: absolute;
      top: 10px; right: 10px;
      width: 22px; height: 22px;
      background: var(--green);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      opacity: 0;
      transform: scale(0.4) rotate(-90deg);
      transition: all .3s cubic-bezier(.34,1.56,.64,1);
      color: #000;
      font-weight: 900;
      flex-shrink: 0;
    }
    .c-initial {
      width: 36px; height: 36px;
      background: var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--gray);
      margin-bottom: 10px;
      transition: all var(--trans);
    }
    .candidate-card.selected .c-initial { background: var(--green-dim); color: var(--green); }
    .c-name { font-size: 13px; font-weight: 600; line-height: 1.3; transition: color var(--trans); }

    /* ── PARTY OPTIONS ── */
    .party-options {
      display: grid;
      gap: 12px;
      margin-bottom: 32px;
    }
    .party-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      cursor: pointer;
      transition: all var(--trans);
      display: flex;
      align-items: center;
      gap: 16px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .party-card:hover { background: var(--card-ho); border-color: #3a3a3a; transform: translateX(4px); }
    .party-card.selected {
      background: #0d2b17;
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green), 0 4px 20px var(--green-glow);
    }
    .party-card.selected .p-radio { background: var(--green); border-color: var(--green); }
    .party-card.selected .p-radio::after { opacity: 1; transform: scale(1); }
    .party-card.selected .p-name { color: var(--green); }
    .p-radio {
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--trans);
      position: relative;
    }
    .p-radio::after {
      content: '';
      width: 8px; height: 8px;
      background: #000;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      transition: all .25s cubic-bezier(.34,1.56,.64,1);
    }
    .p-color {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .p-name { font-size: 15px; font-weight: 700; transition: color var(--trans); }
    .p-desc { font-size: 12px; color: var(--gray); margin-top: 2px; font-weight: 400; }

    /* ── Q3 DUAL NOTE ── */
    .dual-note {
      background: #111;
      border: 1px dashed #333;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 12px;
      color: #666;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── VOTE OPTIONS ── */
    .vote-options {
      display: grid;
      gap: 10px;
      margin-bottom: 32px;
    }
    .vote-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      cursor: pointer;
      transition: all var(--trans);
      display: flex;
      align-items: center;
      gap: 16px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .vote-card:hover { background: var(--card-ho); border-color: #3a3a3a; transform: translateX(4px); }
    .vote-card.selected {
      background: #0d2b17;
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green), 0 4px 20px var(--green-glow);
    }
    .vote-card.selected .p-radio { background: var(--green); border-color: var(--green); }
    .vote-card.selected .p-radio::after { opacity: 1; transform: scale(1); }
    .vote-card.selected .v-name { color: var(--green); }
    .v-name { font-size: 14px; font-weight: 600; transition: color var(--trans); }
    .v-num {
      width: 32px; height: 32px;
      background: var(--border);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--gray);
      flex-shrink: 0;
      transition: all var(--trans);
    }
    .vote-card.selected .v-num { background: var(--green-dim); color: var(--green); }

    /* ── BUTTONS ── */
    .btn-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn-primary {
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 16px 32px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all var(--trans);
      letter-spacing: .5px;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      flex: 1;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.15);
      opacity: 0;
      transition: opacity .2s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--green-glow); }
    .btn-primary:hover::before { opacity: 1; }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-back {
      background: transparent;
      color: var(--gray);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--trans);
    }
    .btn-back:hover { border-color: var(--gray); color: var(--white); }

    /* ── THANK YOU ── */
    .ty-screen { text-align: center; padding: 40px 0; }
    .ty-icon {
      width: 80px; height: 80px;
      background: #0d2b17;
      border: 2px solid var(--green);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      margin: 0 auto 28px;
      animation: popIn .5s cubic-bezier(.34,1.56,.64,1) .1s both;
    }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .ty-title { font-size: 32px; font-weight: 900; margin-bottom: 12px; }
    .ty-title span { color: var(--green); }
    .ty-desc { font-size: 15px; color: #aaa; line-height: 1.7; max-width: 400px; margin: 0 auto 36px; }
    .ty-divider { width: 40px; height: 3px; background: var(--green); border-radius: 99px; margin: 0 auto 36px; }

    .summary-grid {
      display: grid;
      gap: 12px;
      text-align: left;
      margin-bottom: 36px;
    }
    .summary-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--green-dim);
      border-radius: var(--radius);
      padding: 14px 18px;
    }
    .summary-item .s-label { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 4px; }
    .summary-item .s-value { font-size: 13px; font-weight: 600; color: var(--white); line-height: 1.5; }
    .summary-item .s-count { color: var(--green); font-weight: 700; }

    .powered {
      margin-top: 48px;
      font-size: 12px;
      color: #444;
      text-align: center;
      letter-spacing: .5px;
    }
    .powered span { color: var(--green); font-weight: 700; }

    /* ── RIPPLE ── */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(61,255,110,.18);
      transform: scale(0);
      animation: rippleAnim .5s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    /* ── SCROLL ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    @media (max-width: 480px) {
      .candidates-grid { grid-template-columns: repeat(2, 1fr); }
      .stats-row { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-circle">🐻</div>
    <div class="logo-text">DATOS<span>GTO</span></div>
  </div>
  <div style="font-size:12px;color:var(--gray);font-weight:500;">León, Gto. 2025</div>
</div>

<!-- PROGRESS -->
<div class="progress-wrap" id="progressWrap" style="display:none;">
  <div class="progress-meta">
    <span class="step-label" id="stepLabel">Pregunta 1 de 5</span>
    <span id="stepPct">0%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<!-- CONTAINER -->
<div id="app"></div>

<!-- FOOTER -->
<div class="powered">Impulsado por <span>Datos GTO</span> · Especialistas en Datos</div>

<script>
const CANDIDATES = [
  "Toño Guzmán","Alan Márquez","Luis Ernesto Ayala Torres","Jorge Jiménez Lona",
  "Jorge Espadas Galván","Antares Vázquez Alatorre","Enrique Alba Martínez",
  "Bárbara Botello","Vanessa Montes de Oca","José Luis Manrique Hernández",
  "Juan Pablo Delgado","Dessire Ángel Rocha","Mauricio Battaglia Velázquez",
  "Arturo Sánchez Castellanos","Kikis Magaña"
];

const PARTIES = [
  { name:"Partido Acción Nacional", abbr:"PAN", color:"#003DA5", emoji:"🔵" },
  { name:"Morena", abbr:"MORENA", color:"#8B0000", emoji:"🔴" },
  { name:"Movimiento Ciudadano", abbr:"MC", color:"#FF6600", emoji:"🟠" },
  { name:"Partido Verde Ecologista", abbr:"Partido Verde", color:"#2E7D32", emoji:"🟢" }
];

const VOTE_OPTIONS = [
  ...CANDIDATES,
  "— Ninguno / Anularía mi voto",
  "— Aún no lo he decidido"
];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const state = {
  step: 0,
  q1: [],
  q2: [],
  q3a: null,
  q3b: null,
  q4: null,
  candidatesQ1: shuffle(CANDIDATES),
  candidatesQ2: shuffle(CANDIDATES),
  candidatesQ4: shuffle(CANDIDATES)
};

const TOTAL_STEPS = 5;
const app = document.getElementById('app');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const stepLabel    = document.getElementById('stepLabel');
const stepPct      = document.getElementById('stepPct');

function updateProgress(step) {
  if (step === 0) { progressWrap.style.display='none'; return; }
  progressWrap.style.display='block';
  const pct = Math.round((step / TOTAL_STEPS) * 100);
  progressFill.style.width = pct + '%';
  stepLabel.textContent = `Pregunta ${step} de ${TOTAL_STEPS}`;
  stepPct.textContent = pct + '%';
}

function rippleEffect(e, el) {
  const r = document.createElement('span');
  r.classList.add('ripple');
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
  el.appendChild(r);
  setTimeout(() => r.remove(), 600);
}

function initials(name) {
  return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function transition(fn) {
  const current = app.querySelector('.screen');
  if (current) {
    current.classList.add('out');
    setTimeout(() => { app.innerHTML=''; fn(); }, 260);
  } else {
    fn();
  }
}

// ── SCREENS ──

function renderWelcome() {
  state.step = 0;
  updateProgress(0);
  app.innerHTML = `
    <div class="screen">
      <div class="welcome-badge">Encuesta Ciudadana Activa</div>
      <h1 class="welcome-title">¿Quién debe<br>gobernar <span class="highlight">León</span>?</h1>
      <p class="welcome-desc">
        Queremos conocer tu opinión sobre los candidatos y partidos para la Presidencia Municipal de León.
        Son <strong style="color:var(--white)">5 preguntas rápidas</strong> — menos de 3 minutos.
      </p>

      <div class="privacy-box">
        <div class="privacy-icon">🔒</div>
        <div class="privacy-text">
          <strong>Tus respuestas son completamente anónimas.</strong> No recopilamos tu nombre, teléfono ni ningún dato que te identifique. Esta información se usa exclusivamente para análisis ciudadano. Puedes responder con total confianza.
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-num">15</div>
          <div class="stat-label">Candidatos</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">5</div>
          <div class="stat-label">Preguntas</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">&lt;3 min</div>
          <div class="stat-label">Duración</div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-primary" onclick="goToStep(1)">Comenzar encuesta →</button>
      </div>
    </div>
  `;
}

function renderQ1() {
  state.step = 1;
  updateProgress(1);
  const selected = state.q1;

  app.innerHTML = `
    <div class="screen">
      <div class="q-number">Pregunta 1 de 5 · Reconocimiento</div>
      <h2 class="q-title">"De los siguientes personajes públicos en León, ¿a quiénes conoce o ha escuchado nombrar?"</h2>
      <p class="q-subtitle">Seleccione todos los que apliquen · <span class="sel-count" id="cnt1">${selected.length} seleccionados</span></p>

      <div class="candidates-grid" id="grid1">
        ${state.candidatesQ1.map(c => `
          <div class="candidate-card ${selected.includes(c)?'selected':''}"
               data-name="${c}" onclick="toggleCandidate(this,'q1','cnt1')">
            <div class="c-check">✓</div>
            <div class="c-initial">${initials(c)}</div>
            <div class="c-name">${c}</div>
          </div>
        `).join('')}
      </div>

      <div class="btn-row">
        <button class="btn-back" onclick="goToStep(0)">← Atrás</button>
        <button class="btn-primary" id="nextBtn1" onclick="goToStep(2)" ${selected.length===0?'disabled':''}>
          Siguiente →
        </button>
      </div>
    </div>
  `;
}

function renderQ2() {
  state.step = 2;
  updateProgress(2);
  const selected = state.q2;

  app.innerHTML = `
    <div class="screen">
      <div class="q-number">Pregunta 2 de 5 · Rechazo</div>
      <h2 class="q-title">"Independientemente de su preferencia política, ¿por cuál de estas personas USTED NUNCA VOTARÍA para la Presidencia Municipal de León?"</h2>
      <p class="q-subtitle">Seleccione todos los que apliquen · <span class="sel-count" id="cnt2">${selected.length} seleccionados</span></p>

      <div class="candidates-grid" id="grid2">
        ${state.candidatesQ2.map(c => `
          <div class="candidate-card ${selected.includes(c)?'selected':''}"
               data-name="${c}" onclick="toggleCandidate(this,'q2','cnt2')">
            <div class="c-check">✓</div>
            <div class="c-initial">${initials(c)}</div>
            <div class="c-name">${c}</div>
          </div>
        `).join('')}
      </div>

      <div class="btn-row">
        <button class="btn-back" onclick="goToStep(1)">← Atrás</button>
        <button class="btn-primary" id="nextBtn2" onclick="goToStep(3)" ${selected.length===0?'disabled':''}>
          Siguiente →
        </button>
      </div>
    </div>
  `;
}

function renderQ3() {
  state.step = 3;
  updateProgress(3);

  app.innerHTML = `
    <div class="screen">
      <div class="q-number">Pregunta 3 de 5 · Posicionamiento de Partidos</div>

      <!-- 3A -->
      <h2 class="q-title" style="margin-bottom:6px">"¿En cuál de los siguientes partidos <em>confía más</em> para gobernar León?"</h2>
      <p class="q-subtitle" style="margin-bottom:16px">Seleccione una opción</p>
      <div class="party-options" id="partyA">
        ${PARTIES.map(p => `
          <div class="party-card ${state.q3a===p.abbr?'selected':''}"
               data-val="${p.abbr}" onclick="selectParty(this,'q3a','partyA')">
            <div class="p-radio"></div>
            <div class="p-color" style="background:${p.color}22;border:1px solid ${p.color}44">${p.emoji}</div>
            <div>
              <div class="p-name">${p.abbr}</div>
              <div class="p-desc">${p.name}</div>
            </div>
          </div>
        `).join('')}
      </div>

      <!-- divider -->
      <div style="display:flex;align-items:center;gap:12px;margin:24px 0;">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <div style="font-size:11px;color:var(--gray);font-weight:600;letter-spacing:1px">Y TAMBIÉN</div>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>

      <!-- 3B -->
      <h2 class="q-title" style="margin-bottom:6px">"¿Cuál partido considera que tiene las <em>mejores propuestas</em> para resolver los problemas de León?"</h2>
      <p class="q-subtitle" style="margin-bottom:16px">Seleccione una opción</p>
      <div class="party-options" id="partyB">
        ${PARTIES.map(p => `
          <div class="party-card ${state.q3b===p.abbr?'selected':''}"
               data-val="${p.abbr}" onclick="selectParty(this,'q3b','partyB')">
            <div class="p-radio"></div>
            <div class="p-color" style="background:${p.color}22;border:1px solid ${p.color}44">${p.emoji}</div>
            <div>
              <div class="p-name">${p.abbr}</div>
              <div class="p-desc">${p.name}</div>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="dual-note">
        <span>⚙️</span>
        <span>Nota interna: se muestran ambas variantes de P3 para evaluación. Una será retirada antes del despliegue final.</span>
      </div>

      <div class="btn-row">
        <button class="btn-back" onclick="goToStep(2)">← Atrás</button>
        <button class="btn-primary" id="nextBtn3" onclick="goToStep(4)"
          ${(state.q3a && state.q3b)?'':'disabled'}>
          Siguiente →
        </button>
      </div>
    </div>
  `;
}

function renderQ4() {
  state.step = 4;
  updateProgress(4);
  const voteList = [...state.candidatesQ4, "— Ninguno / Anularía mi voto", "— Aún no lo he decidido"];

  app.innerHTML = `
    <div class="screen">
      <div class="q-number">Pregunta 4 de 5 · Intención de voto</div>
      <h2 class="q-title">"Si hoy fueran las elecciones para Presidente Municipal de León, ¿por quién votaría?"</h2>
      <p class="q-subtitle">Seleccione una opción</p>

      <div class="vote-options" id="voteGrid">
        ${voteList.map((c,i) => `
          <div class="vote-card ${state.q4===c?'selected':''}"
               data-val="${c}" onclick="selectVote(this)">
            <div class="p-radio"></div>
            ${!c.startsWith('—') ? `<div class="v-num">${String(i+1).padStart(2,'0')}</div>` : `<div style="width:32px"></div>`}
            <div class="v-name">${c.replace('— ','')}</div>
          </div>
        `).join('')}
      </div>

      <div class="btn-row">
        <button class="btn-back" onclick="goToStep(3)">← Atrás</button>
        <button class="btn-primary" id="nextBtn4" onclick="goToStep(5)"
          ${state.q4?'':'disabled'}>
          Enviar respuestas →
        </button>
      </div>
    </div>
  `;
}

function renderThanks() {
  state.step = 5;
  updateProgress(5);

  const q1txt = state.q1.length ? `${state.q1.length} personaje${state.q1.length>1?'s':''} reconocido${state.q1.length>1?'s':''}` : '—';
  const q2txt = state.q2.length ? `${state.q2.length} candidato${state.q2.length>1?'s':''} descartado${state.q2.length>1?'s':''}` : 'Ninguno';
  const q3atxt = state.q3a || '—';
  const q3btxt = state.q3b || '—';
  const q4txt  = state.q4  || '—';

  app.innerHTML = `
    <div class="screen ty-screen">
      <div class="ty-icon">✓</div>
      <h2 class="ty-title">¡Gracias por<br><span>participar</span>!</h2>
      <p class="ty-desc">Tu opinión ciudadana es valiosa. Tus respuestas han sido registradas de forma <strong>anónima y confidencial</strong>.</p>
      <div class="ty-divider"></div>

      <div class="summary-grid">
        <div class="summary-item">
          <div class="s-label">P1 · Reconocimiento</div>
          <div class="s-value"><span class="s-count">${q1txt}</span>
            ${state.q1.length ? `<br><span style="color:var(--gray);font-size:12px">${state.q1.join(', ')}</span>` : ''}
          </div>
        </div>
        <div class="summary-item">
          <div class="s-label">P2 · Rechazo</div>
          <div class="s-value"><span class="s-count">${q2txt}</span>
            ${state.q2.length ? `<br><span style="color:var(--gray);font-size:12px">${state.q2.join(', ')}</span>` : ''}
          </div>
        </div>
        <div class="summary-item">
          <div class="s-label">P3A · Confianza en partido</div>
          <div class="s-value"><span class="s-count">${q3atxt}</span></div>
        </div>
        <div class="summary-item">
          <div class="s-label">P3B · Mejores propuestas</div>
          <div class="s-value"><span class="s-count">${q3btxt}</span></div>
        </div>
        <div class="summary-item">
          <div class="s-label">P4 · Intención de voto</div>
          <div class="s-value"><span class="s-count">${q4txt}</span></div>
        </div>
      </div>

      <button class="btn-primary" onclick="resetSurvey()">Enviar otra respuesta</button>
    </div>
  `;
}

// ── ACTIONS ──

function toggleCandidate(el, key, cntId) {
  rippleEffect(event, el);
  const name = el.dataset.name;
  const idx = state[key].indexOf(name);
  if (idx === -1) { state[key].push(name); el.classList.add('selected'); }
  else            { state[key].splice(idx,1); el.classList.remove('selected'); }
  document.getElementById(cntId).textContent = state[key].length + ' seleccionados';
  const btnMap = {q1:'nextBtn1', q2:'nextBtn2'};
  const btn = document.getElementById(btnMap[key]);
  if (btn) btn.disabled = state[key].length === 0;
}

function selectParty(el, key, groupId) {
  rippleEffect(event, el);
  document.querySelectorAll(`#${groupId} .party-card`).forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  state[key] = el.dataset.val;
  const btn = document.getElementById('nextBtn3');
  if (btn) btn.disabled = !(state.q3a && state.q3b);
}

function selectVote(el) {
  rippleEffect(event, el);
  document.querySelectorAll('#voteGrid .vote-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  state.q4 = el.dataset.val;
  const btn = document.getElementById('nextBtn4');
  if (btn) btn.disabled = false;
}

const STEPS = [renderWelcome, renderQ1, renderQ2, renderQ3, renderQ4, renderThanks];

function goToStep(n) {
  transition(() => { STEPS[n](); window.scrollTo({top:0,behavior:'smooth'}); });
}

function resetSurvey() {
  Object.assign(state, {
    step:0, q1:[], q2:[], q3a:null, q3b:null, q4:null,
    candidatesQ1: shuffle(CANDIDATES),
    candidatesQ2: shuffle(CANDIDATES),
    candidatesQ4: shuffle(CANDIDATES)
  });
  goToStep(0);
}

// Init
renderWelcome();
</script>
</body>
</html>
